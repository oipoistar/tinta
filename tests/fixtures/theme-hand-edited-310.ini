; A theme written by hand the way INI files often are (#310): spaces around
; the equals sign, keys in capitals, notes after the values. Append it to
; themes.ini (Settings > Configuration files > themes.ini) and open
; theme-emphasis-310.md with "Hand (edited)" as the theme: bold text is
; pink, italic green, both purple, and the rules light blue.

[theme]
name = Hand (edited)
Dark = 1
Background = 101820   ; a deep blue
Text=E0E6F0
heading = F0F4FA (headings)
bold = #FF0066 ; pink bold
italic=00CC88 (green italic)
BoldItalic = 7722AA
selection = CC0000
hr = AABBCC (rules)
