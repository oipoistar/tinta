name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Re-run just the Store submission for an existing release (e.g. after
  # a Partner Center or tooling failure)
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to submit to the Store (e.g. v2.8.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # /MP compiles a target's files on all the runner's cores, and
      # --parallel builds the targets side by side
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CFLAGS: /MP
          CXXFLAGS: /MP

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Tinta v${{ steps.version.outputs.VERSION }}
          body: |
            ## Tinta v${{ steps.version.outputs.VERSION }}

            ### Installation
            - Easiest: `winget install "Tinta Markdown Viewer" -s msstore` (Store-signed, no security prompts, auto-updates), or the [Microsoft Store page](https://apps.microsoft.com/detail/9MZ5MZ3L9RKF)
            - Portable: download `tinta.exe` below and run it (SmartScreen may ask: "More info", then "Run anyway")
            - Optionally run `tinta.exe /register` to register Markdown, Mermaid and PlantUML files

            Citations and papers, themes in CSS, and an interface on one scale. For Live and Sheets, new in 4.0, see the [v4.0.0 notes](https://github.com/oipoistar/tinta/releases/tag/v4.0.0).

            ### Added
            - Citations: name a BibTeX or CSL-JSON library in the front matter and cite in pandoc's syntax. Citations and references are set in APA, Chicago, IEEE, Nature, GB/T 7714 or any `.csl` style; figures, tables, equations and sections number themselves and `@fig:id` refers to them. HTML, Word and PDF keep it all. See [Citations, figures and tables](https://github.com/oipoistar/tinta/blob/master/docs/citations.md)
            - Citing as you write: `[@` lists the library's keys, and the Cite button opens Zotero's picker.
            - Papers: a front matter in pandoc's variables prints as a journal manuscript, with a title block, two columns, page numbers and running heads, and Word gets matching styles.
            - CSS themes: a `.css` file in the `themes` folder is a theme, with real selectors, variables and `light-dark()`; every element takes its own rules on screen, on paper and in Word. `--ui-*` colours the window, a `tinta.css` styles a folder, Ctrl+Alt+click shows which rules style what, and Typora and Obsidian themes import from Settings. See [THEMES.md](https://github.com/oipoistar/tinta/blob/master/THEMES.md)
            - Ctrl+Shift+T reopens the tab closed last, with its place and unsaved text; a tab's menu lists the last five.

            ### Changed
            - The ten built-in themes are one design in ten palettes, with clearer headings, rounder code blocks, calmer tables and colours that read at 4.5 to 1. A theme of your own can start from one with `@import "Paper"`.
            - Themes made in the colour editor from a built-in theme keep its new design; themes already in `themes.ini` keep their look.
            - Settings is grouped under labels and scrolls in a short window, where its last settings could not be reached.
            - The theme chooser's cards keep their size and scroll; with many themes the names lay over the samples.
            - Menus look alike everywhere, the shortcut list stands in two columns, and no label in the interface is smaller than 11.
            - The window has an edge in the theme's colour, and the tab row a line under it, an edged chosen tab and names on one line.
            - Letters are smoothed for the monitor the window is on.

            ### What's included
            - Export as HTML, DOCX, or PDF, plus optional Pandoc formats
            - 22 natively rendered Mermaid diagram families, and PlantUML diagrams through a local PlantUML
            - Tabbed interface with drag, session restore, and a tab context menu
            - 10 themes (5 light, 5 dark) plus themes of your own in CSS
            - Hardware-accelerated rendering via Direct2D
            - Single portable executable of about 5 MB, no dependencies
          files: build/Release/tinta.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the release to the Microsoft Store (app 9MZ5MZ3L9RKF).
  # Skips itself until the MSSTORE_* secrets are configured — see packaging/msix/README notes.
  store:
    runs-on: windows-latest
    needs: build
    # Runs after a successful tag build, or standalone via workflow_dispatch
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}

    steps:
      - name: Check Store credentials
        id: gate
        shell: bash
        run: |
          if [ -n "$MSSTORE_CLIENT_SECRET" ]; then
            echo "on=true" >> $GITHUB_OUTPUT
          else
            echo "on=false" >> $GITHUB_OUTPUT
            echo "MSSTORE_* secrets not set - skipping Store publish."
          fi

      - name: Checkout code
        if: steps.gate.outputs.on == 'true'
        uses: actions/checkout@v4

      - name: Download release asset
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\Release | Out-Null
          gh release download $env:RELEASE_TAG --pattern tinta.exe --output build\Release\tinta.exe --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack MSIX
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: pwsh -File packaging/msix/pack.ps1 -ExePath build/Release/tinta.exe

      - name: Setup Microsoft Store CLI
        if: steps.gate.outputs.on == 'true'
        uses: microsoft/setup-msstore-cli@v1
        with:
          # v0.4.0 (2026-08-18, .NET 10/native-AOT rework) fails uploads at
          # 34% consistently; pin the last known-good release
          version: "v0.3.9"

      - name: Configure Store CLI
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET

      - name: Publish to Microsoft Store
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: |
          $msix = Get-ChildItem packaging/msix/out/tinta-*.msix | Select-Object -First 1
          msstore publish $msix.FullName --appId 9MZ5MZ3L9RKF
