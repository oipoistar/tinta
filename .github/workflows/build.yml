name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Re-run just the Store submission for an existing release (e.g. after
  # a Partner Center or tooling failure)
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to submit to the Store (e.g. v2.8.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # /MP compiles a target's files on all the runner's cores, and
      # --parallel builds the targets side by side
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CFLAGS: /MP
          CXXFLAGS: /MP

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Tinta v${{ steps.version.outputs.VERSION }}
          body: |
            ## Tinta v${{ steps.version.outputs.VERSION }}

            ### Installation
            - Easiest: `winget install "Tinta Markdown Viewer" -s msstore` (Store-signed, no security prompts, auto-updates), or the [Microsoft Store page](https://apps.microsoft.com/detail/9MZ5MZ3L9RKF)
            - Portable: download `tinta.exe` below and run it (SmartScreen may ask: "More info", then "Run anyway")
            - Optionally run `tinta.exe /register` to register Markdown, Mermaid and PlantUML files

            Tinta 4.0 brings two new ways to work: **Live**, a WYSIWYG editor where you write on the page as it reads, and **Sheets**, an infinite canvas of Markdown notes. Both are experimental in this release. They are ready to use, and they will grow with what you tell me: I'm looking forward to any suggestions for improving them, so please open an issue with what you would change.

            ### Live: write on the page (experimental)
            - A second way to edit beside Source: the page as the reading view lays it out, with the Markdown showing only in the block you are typing in. The pill at the top of the edit rail switches between them, and so does Ctrl+/; Tinta remembers the choice
            - Live edits the same text as Source, byte for byte, with the same undo, so switching changes nothing in the file
            - Typing knows Markdown: lists, numbers and tasks go on and end, Tab nests items and walks table cells, a bracket or mark typed over a selection wraps it, and an address pasted over words links them
            - A slash menu (`/`) makes every block Tinta draws: headings, lists, callouts, code, maths, Mermaid and PlantUML diagrams, a table, a picture, a link, a footnote and properties. Words selected on a line get a format bar
            - A right-click menu that knows what is under the pointer: formats, links, pictures, tasks, a table's rows and columns, Turn into and Insert
            - On a touchscreen a finger held on a word selects it and grows the selection by words, and the menu opens where it lifts
            - More in [Live: write on the page](https://github.com/oipoistar/tinta/blob/master/docs/live-editor.md)

            ### Sheets: an infinite canvas of notes (experimental)
            - A sheet (`.smd`) lays out cards that are real Markdown notes in the sheet's folder, joined by arrows and gathered in groups. Make one with **New sheet** on the start page (or press S there), or open the **Sheet tour** among the start page's Learn cards
            - Semantic zoom: far out a card is its title, close up the rendered note. The arrow keys walk between cards, and Tab grows a mind map
            - The sheet is its folder: notes added from elsewhere wait in a tray, renamed ones are followed, and links written in the notes show as ghost lines that become arrows with a click
            - Lanes write a property such as `status:` into the notes dropped in them, so a board and its notes agree
            - A sheet compiles into one document along its arrows, presents along them (P) and tidies itself (Ctrl+L), and a pasted Mermaid flowchart arrives as cards
            - Cards are typed in with Live's engine, slash menu and format bar included
            - Obsidian `.canvas` files open as sheets too, and save back as JSON Canvas
            - More in [Sheets](https://github.com/oipoistar/tinta/blob/master/docs/sheets.md)

            ### Also new
            - The source editor shows Markdown in colour: headings, links and code stand out, the marks go faint, and fenced code and the properties take their language's colours. Settings, Editor turns it off. Requested by @derek-price (#268)
            - A numbered list button on the edit rail. Requested by @nokia5118 (#304)
            - **Exit editing** in the application menu while editing. Contributed by @SHM-white (#300)
            - Touch: a finger held in the split preview selects the rendered text and offers Copy, and Help scrolls under a finger. Contributed by @SHM-white (#301, #302)

            ### Fixed
            - The bullet, task and quote buttons mark every line of a selection, in one Ctrl+Z, instead of only the caret's line, and swap one list mark for another instead of stacking them. Reported by @nokia5118 (#306)
            - Lines pasted on a list item become items of that list, as Enter makes them, instead of plain paragraphs after the first. Reported by @nokia5118 (#305)
            - Touch: a finger held in the source editor selects whole words; touches on menus, search controls and panel edges reach them instead of panning the page; a finger that catches a flicked page only stops it; and a pan, a second finger or a change of tab starts over cleanly. Contributed by @SHM-white (#295, #296, #297, #298)
            - A link to a heading in the split preview moves the source pane with it. Contributed by @SHM-white (#299)
            - A table's Fit and Copy TSV buttons take a click before the cell under them and stay above a cell being edited. Contributed by @SHM-white (#303)
            - Ctrl+K makes a link in Source, as the rail's tooltip says

            ### What's included
            - Export as HTML, DOCX, or PDF, plus optional Pandoc formats
            - 22 natively rendered Mermaid diagram families, and PlantUML diagrams through a local PlantUML
            - Tabbed interface with drag, session restore, and a tab context menu
            - 10 tuned themes (5 light, 5 dark) plus custom themes
            - Hardware-accelerated rendering via Direct2D
            - Single portable executable about 4 MB, no dependencies
          files: build/Release/tinta.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the release to the Microsoft Store (app 9MZ5MZ3L9RKF).
  # Skips itself until the MSSTORE_* secrets are configured — see packaging/msix/README notes.
  store:
    runs-on: windows-latest
    needs: build
    # Runs after a successful tag build, or standalone via workflow_dispatch
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}

    steps:
      - name: Check Store credentials
        id: gate
        shell: bash
        run: |
          if [ -n "$MSSTORE_CLIENT_SECRET" ]; then
            echo "on=true" >> $GITHUB_OUTPUT
          else
            echo "on=false" >> $GITHUB_OUTPUT
            echo "MSSTORE_* secrets not set - skipping Store publish."
          fi

      - name: Checkout code
        if: steps.gate.outputs.on == 'true'
        uses: actions/checkout@v4

      - name: Download release asset
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\Release | Out-Null
          gh release download $env:RELEASE_TAG --pattern tinta.exe --output build\Release\tinta.exe --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack MSIX
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: pwsh -File packaging/msix/pack.ps1 -ExePath build/Release/tinta.exe

      - name: Setup Microsoft Store CLI
        if: steps.gate.outputs.on == 'true'
        uses: microsoft/setup-msstore-cli@v1
        with:
          # v0.4.0 (2026-08-18, .NET 10/native-AOT rework) fails uploads at
          # 34% consistently; pin the last known-good release
          version: "v0.3.9"

      - name: Configure Store CLI
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET

      - name: Publish to Microsoft Store
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: |
          $msix = Get-ChildItem packaging/msix/out/tinta-*.msix | Select-Object -First 1
          msstore publish $msix.FullName --appId 9MZ5MZ3L9RKF
