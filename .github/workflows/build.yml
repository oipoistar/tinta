name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Re-run just the Store submission for an existing release (e.g. after
  # a Partner Center or tooling failure)
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to submit to the Store (e.g. v2.8.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # /MP compiles a target's files on all the runner's cores, and
      # --parallel builds the targets side by side
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        env:
          CFLAGS: /MP
          CXXFLAGS: /MP

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Tinta v${{ steps.version.outputs.VERSION }}
          body: |
            ## Tinta v${{ steps.version.outputs.VERSION }}

            ### Installation
            - Easiest: `winget install "Tinta Markdown Viewer" -s msstore` (Store-signed, no security prompts, auto-updates), or the [Microsoft Store page](https://apps.microsoft.com/detail/9MZ5MZ3L9RKF)
            - Portable: download `tinta.exe` below and run it (SmartScreen may ask: "More info", then "Run anyway")
            - Optionally run `tinta.exe /register` to register Markdown, Mermaid and PlantUML files

            A fix release for 4.0.1. For what is new in 4.0 (Live and Sheets), see the [v4.0.0 notes](https://github.com/oipoistar/tinta/releases/tag/v4.0.0).

            ### Added
            - Pinned tabs, from a tab's menu: a pinned tab keeps to the start of the row as its first letter and stays in view. The title bar's pin is remembered for the next start. Requested by @Fallgrim (#312)
            - Equation numbers with `\tag`, and `\eqref` and `\ref` to an equation's `\label`, in the reader and the HTML and Word exports. Requested by @TiegenFang (#314)
            - With wrapping off, a scrollbar along the source editor's foot for lines that run past it, and the horizontal wheel pans them. Requested by @TiegenFang (#314)
            - `mathFont=` and `cjkFont=` in `settings.ini` name the faces for equations and for Chinese, Japanese and Korean letters. Requested by @TiegenFang (#314)

            ### Changed
            - Source and Live follow a file another program changes, as the reader does, and ask Reload or Keep mine when there are unsaved edits. Requested by @QuamerX (#311)
            - Each level of a bullet list has its own bullet, closer to its text. In Live, Tab takes an item one level in and Shift+Tab undoes it, and only the line being typed in is highlighted. Requested by @Fallgrim (#315)

            ### Fixed
            - A double-click in Source selects whole words in every script, Turkish, Greek and Cyrillic included. Reported by @Fallgrim (#313)
            - Selections over bold, italic, links and code are one even band, without seams in the reader or brighter strips in Live. Reported by @Fallgrim (#313)
            - Two `$$` equations in a row are set as two, and Word exports include `$$` equations. Reported by @TiegenFang (#314)
            - An inline `$` equation can close before a letter, as in pandoc, so `$R=50\,\mu$m` no longer runs on; prices stay text. Reported by @TiegenFang (#314)
            - Signs after brackets, brackets beside slanted letters and accents such as the tilde are set as TeX sets them. Reported by @TiegenFang (#314)

            ### What's included
            - Export as HTML, DOCX, or PDF, plus optional Pandoc formats
            - 22 natively rendered Mermaid diagram families, and PlantUML diagrams through a local PlantUML
            - Tabbed interface with drag, session restore, and a tab context menu
            - 10 tuned themes (5 light, 5 dark) plus custom themes
            - Hardware-accelerated rendering via Direct2D
            - Single portable executable about 4 MB, no dependencies
          files: build/Release/tinta.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the release to the Microsoft Store (app 9MZ5MZ3L9RKF).
  # Skips itself until the MSSTORE_* secrets are configured — see packaging/msix/README notes.
  store:
    runs-on: windows-latest
    needs: build
    # Runs after a successful tag build, or standalone via workflow_dispatch
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}

    steps:
      - name: Check Store credentials
        id: gate
        shell: bash
        run: |
          if [ -n "$MSSTORE_CLIENT_SECRET" ]; then
            echo "on=true" >> $GITHUB_OUTPUT
          else
            echo "on=false" >> $GITHUB_OUTPUT
            echo "MSSTORE_* secrets not set - skipping Store publish."
          fi

      - name: Checkout code
        if: steps.gate.outputs.on == 'true'
        uses: actions/checkout@v4

      - name: Download release asset
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\Release | Out-Null
          gh release download $env:RELEASE_TAG --pattern tinta.exe --output build\Release\tinta.exe --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack MSIX
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: pwsh -File packaging/msix/pack.ps1 -ExePath build/Release/tinta.exe

      - name: Setup Microsoft Store CLI
        if: steps.gate.outputs.on == 'true'
        uses: microsoft/setup-msstore-cli@v1
        with:
          # v0.4.0 (2026-08-18, .NET 10/native-AOT rework) fails uploads at
          # 34% consistently; pin the last known-good release
          version: "v0.3.9"

      - name: Configure Store CLI
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET

      - name: Publish to Microsoft Store
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: |
          $msix = Get-ChildItem packaging/msix/out/tinta-*.msix | Select-Object -First 1
          msstore publish $msix.FullName --appId 9MZ5MZ3L9RKF
