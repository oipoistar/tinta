name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Re-run just the Store submission for an existing release (e.g. after
  # a Partner Center or tooling failure)
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to submit to the Store (e.g. v2.8.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Tinta v${{ steps.version.outputs.VERSION }}
          body: |
            ## Tinta v${{ steps.version.outputs.VERSION }}

            ### Installation
            - Easiest: `winget install "Tinta Markdown Viewer" -s msstore` (Store-signed, no security prompts, auto-updates), or the [Microsoft Store page](https://apps.microsoft.com/detail/9MZ5MZ3L9RKF)
            - Portable: download `tinta.exe` below and run it (SmartScreen may ask: "More info", then "Run anyway")
            - Optionally run `tinta.exe /register` to register Markdown and Mermaid files

            ### Search results panel (#246)
            - Ctrl+Shift+F, or the new list button at the end of the search bar, opens a Results panel beside the page: every match with a snippet, grouped under its heading (#246)
            - Matches in your other open tabs and in the document's folder follow, by line. A click opens the file in its own tab at that match, and two checkboxes choose what else is searched (#246)
            - Suggested by @Lex987 (#246)

            ### Tab hover card (#246)
            - Resting the pointer on a tab shows its full name, its folder and what its dot means, so two README.md tabs can be told apart (#246)
            - Suggested by @Lex987 (#246)

            ### Docked edit-mode preview (#245)
            - The preview in edit mode is docked beside the editor like the side panels, below a tab strip that spans the window, instead of floating over it (#245)
            - The Esc hint and the Read button's introduction show in your first three edit sessions only, and fade in place (#245)
            - Reported by @whiskyrye (#245)

            ### Print margins (#257)
            - The print preview chooses the page margins, 12.7, 19.05 or 25.4 mm (in inches where Windows measures in inches), and remembers the choice (#257)

            ### Fixed
            - Interface text uses the interface language's font, so a Chinese, Japanese or Korean interface no longer mixes fonts from other languages. Reported by @go4399 (#254)
            - Links to raw HTML anchors such as `<a id="a1"></a>` jump to them, and the tags no longer show as text. Reported by @derek-price (#255)
            - Word export uses the screen's font for Chinese text, also for code and the theme's heading font. Reported by @go4399 (#256)
            - Printing and PDF use the full width between the page margins whatever the reading width, and every code block lines up with the text. Reported by @go4399 (#257)
            - Printing and PDF keep a custom theme's fonts. Reported by @go4399 (#258)
            - Double-clicking a word in a table cell selects only that word, and a copied row pastes into a spreadsheet as separate columns. Spotted by @Lex987 (#246)
            - An open search follows tab switches and file reloads (#246)

            ### What's included
            - Export as HTML, DOCX, or PDF, plus optional Pandoc formats
            - 22 natively rendered Mermaid diagram families
            - Tabbed interface with drag, session restore, and a tab context menu
            - 10 tuned themes (5 light, 5 dark) plus custom themes
            - Hardware-accelerated rendering via Direct2D
            - Single portable executable about 2.5 MB, no dependencies
          files: build/Release/tinta.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the release to the Microsoft Store (app 9MZ5MZ3L9RKF).
  # Skips itself until the MSSTORE_* secrets are configured — see packaging/msix/README notes.
  store:
    runs-on: windows-latest
    needs: build
    # Runs after a successful tag build, or standalone via workflow_dispatch
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}

    steps:
      - name: Check Store credentials
        id: gate
        shell: bash
        run: |
          if [ -n "$MSSTORE_CLIENT_SECRET" ]; then
            echo "on=true" >> $GITHUB_OUTPUT
          else
            echo "on=false" >> $GITHUB_OUTPUT
            echo "MSSTORE_* secrets not set - skipping Store publish."
          fi

      - name: Checkout code
        if: steps.gate.outputs.on == 'true'
        uses: actions/checkout@v4

      - name: Download release asset
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\Release | Out-Null
          gh release download $env:RELEASE_TAG --pattern tinta.exe --output build\Release\tinta.exe --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack MSIX
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: pwsh -File packaging/msix/pack.ps1 -ExePath build/Release/tinta.exe

      - name: Setup Microsoft Store CLI
        if: steps.gate.outputs.on == 'true'
        uses: microsoft/setup-msstore-cli@v1
        with:
          # v0.4.0 (2026-08-18, .NET 10/native-AOT rework) fails uploads at
          # 34% consistently; pin the last known-good release
          version: "v0.3.9"

      - name: Configure Store CLI
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET

      - name: Publish to Microsoft Store
        if: steps.gate.outputs.on == 'true'
        shell: pwsh
        run: |
          $msix = Get-ChildItem packaging/msix/out/tinta-*.msix | Select-Object -First 1
          msstore publish $msix.FullName --appId 9MZ5MZ3L9RKF
